const $=id=>document.getElementById(id);

// ---------- background: drifting gold light, dot grid, beat pulse ----------

  g=x.createRadialGradient(1080-gx*.6,1920-gy*.7,0,1080-gx*.6,1920-gy*.7,800);g.addColorStop(0,'rgba(60,90,170,.16)');g.addColorStop(1,'rgba(60,90,170,0)');x.fillStyle=g;x.fillRect(0,0,1080,1920);

// ---------- map (vertical crop) ----------
function drawMap(t,alpha,glowAt,zoom,cx0){

  for(const [px,py,h,f] of MAP.dots){const on=h>0&&t>=glowAt+f*.9;
    if(on){const k=p(t,glowAt+f*.9,glowAt+f*.9+.3);const r=1.6+h*1.6;x.fillStyle=`rgba(240,207,122,${(.5+.5*h)*k})`;x.beginPath();x.arc(px,py,r*(1+(1-k)*1.5),0,6.283);x.fill();
      if(h>.5){x.fillStyle=`rgba(240,207,122,${.08*k})`;x.beginPath();x.arc(px,py,r*3.2,0,6.283);x.fill()}}

// ---------- captions: rolling chunks of the narration, word by word ----------

  const ch=[];let cur=[];ws.forEach((w,i)=>{cur.push([...w,i]);const end=/[.,?]$/.test(w[0]);if(cur.length>=3&&(end||cur.length>=4)||end&&cur.length>=2){ch.push(cur);cur=[]}});if(cur.length)ch.push(cur);
  let ci=0;for(let i=0;i<ch.length;i++)if(t>=ch[i][0][1]-.05)ci=i;
  const c=ch[ci];const vEnd=TL.vo[key][0]+TL.vo[key][1];const fade=1-p(t,vEnd+.25,vEnd+.55);
  if(t<c[0][1]-.05){el.innerHTML='';return}
  const c0=c[0][1];el.innerHTML=c.map(([w,wt],j)=>{const k=p(t,c0-.04+j*.05,c0+.14+j*.05);const next=c[j+1]?c[j+1][1]:vEnd;const act=t>=wt&&t<next;

    return `<span class="w" style="opacity:${k*fade};transform:translateY(${(1-back(k))*40}px) scale(${lerp(.7,1,back(k))});color:${gold?'var(--gold2)':'#fff'};opacity:${k*fade*(act||t>=wt?1:.45)}">${w}</span>`}).join('');

// ---------- real Deal Desk screens (public tenders, real prices, invented suppliers) ----------
function frameAt(k,t){if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++)if(t<=k[i][0]){const[a,f0]=k[i-1],[b,f1]=k[i];return Math.round(lerp(f0,f1,(t-a)/(b-a)))}return k[k.length-1][1]}

const SHOTS={
 tend:{shot:'tlist',stat:['34,644','open tenders · 195 countries'],frames:[[0.15,0],[1.3,57],[1.5,61],[1.6,63],[9,77]],cam:[[0,1.25,800,450,-6],[1.2,1.25,800,450,0],[1.9,1.8,1250,330,0],[3.4,1.8,1250,430,0],[9,1.7,1200,470,3]],clicks:[[1.5,577,376]]},
 sup:{shot:'sup',stat:['250,000','suppliers, matched by evidence'],frames:[[0.1,26],[0.5,41],[0.8,55],[1.1,56],[1.2,58],[1.9,66],[2.3,84],[2.5,85],[2.6,88],[9,95]],cam:[[0,1.5,700,330,6],[0.8,1.55,700,330,0],[1.2,1.85,560,450,0],[2.1,1.85,560,480,0],[2.6,1.85,600,560,0],[9,1.75,620,520,-3]],clicks:[[1.1,407,464],[2.5,636,584]]},
 price:{shot:'prices',stat:['18','official price sources'],frames:[[0.1,5],[0.5,22],[0.7,30],[1.5,32],[1.7,42],[1.9,46],[3.4,83],[9,83]],cam:[[0,1.5,800,300,-6],[0.6,1.55,800,330,0],[1.0,2.1,1030,300,0],[1.6,2.1,1030,300,0],[2.0,1.5,800,450,0],[9,1.6,800,520,3]],clicks:[]},
 est:{shot:'est',stat:['EV','expected value · win chance · verdict'],frames:[[0.05,22],[0.3,29],[2.4,99],[2.7,105],[9,117]],cam:[[0,1.8,1210,330,6],[0.5,1.85,1210,330,0],[2.4,1.85,1210,380,0],[2.9,2.0,1200,660,0],[9,1.9,1180,700,-3]],clicks:[],knob:[0.3,2.4]},
};

  const c=$('cur');c.style.left=(cx-8)+'px';c.style.top=(cy-5)+'px';c.style.opacity=vis*(1-eout);
  const r=$('rip');if(rip>=0&&rip<1){r.style.left=(cx-55)+'px';r.style.top=(cy-55)+'px';r.style.opacity=1-rip;r.style.transform=`scale(${.3+rip})`}else r.style.opacity=0;

}

const FRAGS=['RFQ_final_v7.pdf','price??','call me back','Tender_EN(2).docx','who makes this?','FOB or CFR?','missed the deadline','Re: Re: Re: quote','is this supplier real?','landed cost?','send again pls','fax attached'];

function phone(x0,y0,w,h,inner,op,sc){return `<div class="abs" style="left:${x0}px;top:${y0}px;width:${w}px;height:${h}px;border-radius:72px;background:#03060c;border:4px solid #2a3f66;padding:20px;opacity:${op};transform:scale(${sc});box-shadow:0 70px 160px rgba(0,0,0,.7),0 0 90px rgba(216,178,90,.12)"><div style="width:100%;height:100%;border-radius:54px;background:#0d1525;overflow:hidden;position:relative">

async function frame(t){
  $('card').style.display='none';$('cur').style.opacity=0;$('rip').style.opacity=0;$('L').innerHTML='';$('flash').style.opacity=0;drawMap(0,0,0,1,0);

  } else if(sc.id==='chaos'){

    FRAGS.forEach((f,i)=>{const a=i*2.399,r=300+((i*137)%160);const k=p(lt,.05+i*.16,.25+i*.16);
      let x=540+Math.cos(a)*r*.95+Math.sin(lt*2.3+i)*12,y=1150+Math.sin(a)*r*1.35+Math.cos(lt*1.9+i)*10;x=lerp(x,540,ei(coll));y=lerp(y,1150,ei(coll));
      h+=`<div class="frag" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${(i%2?-1:1)*(4+i%5)*(1-coll)}deg) scale(${lerp(1.4,1,eo(k))*(1-coll*.95)});opacity:${k*(1-coll)}">${f}</div>`});

      <div class="abs" style="left:0;right:0;top:620px;display:flex;justify-content:center;opacity:${k*out};transform:scale(${lerp(2.2,1,back(k))})">${MARK(220,'a')}</div>
      <div class="abs" style="left:0;right:0;top:880px;text-align:center;font:400 230px Serif;letter-spacing:${lerp(40,0,eo(k2))}px;opacity:${k2*out}">Sinder</div>
      <div class="abs" style="left:80px;right:80px;top:1170px;text-align:center;font:italic 400 76px/1.1 Serif;color:#d9e0ec;opacity:${k3*out};transform:translateY(${(1-eo(k3))*30}px)">The trading desk that<br><span style="color:var(--gold2)">runs on software.</span></div>`;

      const x=150+col*260+Math.sin(u*2+col)*20,y=lerp(660,GY-40,ei(ph));const a=p(lt,.05+col*.08,.3+col*.08)*p(ph,0,.12)*(1-p(ph,.85,1));
