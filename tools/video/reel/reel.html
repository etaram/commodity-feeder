<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),p=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;

const MARK=(sz,id)=>`<svg viewBox="0 0 64 64" width="${sz}" height="${sz}"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2d52"/><stop offset="1" stop-color="#0b1324"/></linearGradient><linearGradient id="d${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0cf7a"/><stop offset="1" stop-color="#b8902e"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g${id})" stroke="#3a5488"/><path id="mp${id}" d="M44 20c-2.5-4-7-6-12-6-7 0-12 4-12 9.5 0 11 24 7 24 18 0 6-5.5 10-13 10-6 0-10.5-2.5-13-6.5" fill="none" stroke="url(#d${id})" stroke-width="5.5" stroke-linecap="round"/><circle cx="45" cy="16.5" r="3.4" fill="#f0cf7a"/><circle cx="19" cy="47.5" r="3.4" fill="#f0cf7a"/></svg>`;
let MAP,TL,SC,W;const CUES=[];const cue=(t,type,g=1)=>CUES.push({t:+t.toFixed(3),type,g});
const wt=(k,re)=>{const w=TL.words[k].find(x=>re.test(x[0]));return w?w[1]:TL.vo[k][0]};
// ---------- camera poses for the phone, one per scene ----------
const POSE={hook:[540,1250,.96,0,0,0],problem:[540,1210,.96,0,0,0],brand:[540,1250,.84,-10,4,0],tend:[650,1200,.96,-14,2,0],sup:[300,1260,.72,18,2,0],price:[230,1300,.56,24,0,0],bid:[850,1300,.56,-24,0,0],engine:[540,1180,.58,0,10,0],meet:[540,1240,.96,0,0,0],cta:[540,1330,.62,180,0,0]};
window.setup=(map,tl)=>{MAP=map;TL=tl;W=tl.words;SC=tl.scenes.map(([id,t0,t1])=>({id,t0,t1}));window.TOTAL=tl.total;buildCues();window.CUESOUT=CUES};
const scene=id=>SC.find(s=>s.id===id);
// ---------- choreography constants shared with the sound cues ----------
const NOTI=[['Supplier · WhatsApp','price??'],['Buyer','who makes this?'],['Agent','RFQ_final_v7.pdf'],['Supplier','FOB or CFR?'],['Buyer','deadline is Friday'],['Forwarder','Re: Re: Re: quote'],['Supplier','send again pls'],['Agent','Tender_EN(2).docx'],['Buyer','is this supplier real?'],['Bank','LC draft attached']];
const notiT=i=>{const s=scene('problem');const a=s.t0+.25,b=wt('r2',/PDFs/)+.2;const u=i/(NOTI.length-1);return a+(b-a)*(1-Math.pow(1-u,1.6))};
function buildCues(){
  cue(0,'impact',.8);cue(.05,'riser_short',.5);
  cue(wt('r1',/^tenders/),'stamp',.7);cue(wt('r1',/^live/),'live',1);
  NOTI.forEach((n,i)=>cue(notiT(i),'ping',.7+.3*i/NOTI.length));
  const b=scene('brand');cue(b.t0,'drop',1);cue(b.t0+.05,'wipe',.8);
  for(const s of SC)if(!['hook','brand','problem'].includes(s.id))cue(s.t0-.25,'whoosh',.9);
  cue(scene('tend').t0+1.55,'tap',.8);cue(scene('tend').t0+1.0,'pop',.7);cue(scene('tend').t0+2.3,'stamp',.8);
  [/^Finds/,/^really/,/^makes/].forEach(r=>cue(wt('r5',r),'pop',.8));
  cue(wt('r6',/^Prices/),'pop',.8);for(let i=0;i<6;i++)cue(wt('r6',/^Prices/)+.35+i*.12,'tick',.6);
  cue(wt('r7',/^bid/),'pop',.7);cue(wt('r7',/^dollar/),'stamp',1);
  [/^agents/,/^sources/,/^countries/,/^clock/].forEach(r=>cue(wt('r8',r),'pop',.7));
  const m=scene('meet');cue(m.t0,'muffle_on',1);[/^Ask/,/^Supplier/,/^contact/,/^price/].forEach(r=>cue(wt('r9',r)+.15,'msg',.8));cue(m.t1-1.0,'tap',.9);cue(m.t1-.3,'muffle_off',1);
  cue(wt('r10',/^Let/),'impact',1.1);
}
// ---------- background: depth bokeh + drifting gold light ----------
const BOK=[...Array(46)].map((_,i)=>({x:(i*397)%1080,y:(i*733)%1920,r:10+(i*37)%70,z:.2+((i*53)%80)/100,h:i%5==0}));
function bg(t,pump,tone){
  const c=$('bg'),x=c.getContext('2d');const g0=x.createLinearGradient(0,0,0,1920);g0.addColorStop(0,'#060b16');g0.addColorStop(1,'#03050b');x.fillStyle=g0;x.fillRect(0,0,1080,1920);
  const gx=540+Math.sin(t*.3)*320,gy=1100+Math.cos(t*.23)*520;let g=x.createRadialGradient(gx,gy,0,gx,gy,950);g.addColorStop(0,`rgba(216,178,90,${(.09+.05*pump)*tone})`);g.addColorStop(1,'rgba(216,178,90,0)');x.fillStyle=g;x.fillRect(0,0,1080,1920);
  g=x.createRadialGradient(1080-gx*.7,1920-gy*.6,0,1080-gx*.7,1920-gy*.6,800);g.addColorStop(0,`rgba(55,90,180,${.16*tone})`);g.addColorStop(1,'rgba(55,90,180,0)');x.fillStyle=g;x.fillRect(0,0,1080,1920);
  for(const b of BOK){const yy=((b.y-t*40*b.z)%2100+2100)%2100-90;const xx=b.x+Math.sin(t*.4+b.y)*30*b.z;g=x.createRadialGradient(xx,yy,0,xx,yy,b.r);const a=(b.h?.10:.05)*tone*(.6+.4*pump);g.addColorStop(0,b.h?`rgba(240,207,122,${a})`:`rgba(150,175,230,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(xx,yy,b.r,0,6.283);x.fill()}
}
function drawMap(t,alpha,cx,cy,zoom,reveal,focus){
  const c=$('map'),x=c.getContext('2d');x.clearRect(0,0,1080,1920);if(alpha<=0)return;
  x.save();x.globalAlpha=alpha;x.translate(540,cy);x.scale(zoom,zoom);x.translate(-cx,-540);
  for(const [px,py,h,f] of MAP.dots){const d=Math.hypot(px-cx,py-540)/1100;const on=reveal>d;const k=cl((reveal-d)*6);
    if(focus){const fd=Math.hypot(px-focus[0],py-focus[1]);if(fd<26){x.fillStyle=`rgba(240,207,122,${.9*focus[2]})`;x.beginPath();x.arc(px,py,3.2,0,6.283);x.fill();continue}}
    if(!on)continue;
    if(h>0){const pulse=.75+.25*Math.sin(t*4-d*9);const r=1.5+h*1.7;x.fillStyle=`rgba(240,207,122,${(.45+.55*h)*k*pulse*(focus?.35:1)})`;x.beginPath();x.arc(px,py,r,0,6.283);x.fill();
      if(h>.55&&!focus){x.fillStyle=`rgba(240,207,122,${.07*k})`;x.beginPath();x.arc(px,py,r*3.4,0,6.283);x.fill()}}
    else{x.fillStyle=`rgba(130,150,195,${.36*k})`;x.beginPath();x.arc(px,py,1.2,0,6.283);x.fill()}}
  x.restore();
}
// ---------- phone ----------
function poseAt(sc,lt){const prev=SC[SC.indexOf(sc)-1];const a=POSE[prev?prev.id:sc.id],b=POSE[sc.id];const k=ex(p(lt,0,.7));return [a.map((v,i)=>lerp(v,b[i],k)),k]}
function setPhone(P,extra=''){const [x,y,s,ry,rx,rz]=P;$('phone').style.transform=`translate(${x-288}px,${y-602}px) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${s}) ${extra}`;
  $('glare').style.background=`linear-gradient(${115+ry*.8}deg,rgba(255,255,255,0) 30%,rgba(255,255,255,${.07+Math.abs(ry)/400}) 48%,rgba(255,255,255,0) 62%)`}
let curImg='';async function scrImg(f,dim=0){const src=MS+pad(f)+'.jpg';const el=$('scrIn');if(curImg!==src){el.innerHTML=`<img id="mimg" src="${src}">`;curImg=src;await $('mimg').decode().catch(()=>{})}el.style.filter=dim?`brightness(${1-dim}) blur(${dim*6}px)`:'none'}
const scrHTML=h=>{curImg='';$('scrIn').innerHTML=h;$('scrIn').style.filter='none'};
// ---------- kinetic captions: real word times, sentence blocks ----------
const KEY={hook:'r1',problem:'r2',tend:'r4',sup:'r5',price:'r6',bid:'r7',engine:'r8',meet:'r9',cta:'r10'};
const GOLD=/^(thousand|live|open|right|now|deal|lost|tender|really|makes|source|bid|dollar|agents|sources|countries|clock|Telegram|seconds|partners|investors)/i;
function captions(t,sc){
  const el=$('cap');const k=KEY[sc.id];if(!k){el.innerHTML='';return}
  const ws=W[k];const sent=[];let cur=[];ws.forEach((w,i)=>{cur.push(w);if(/[.?!]$/.test(w[0])||i==ws.length-1){sent.push(cur);cur=[]}});
  let si=-1;for(let i=0;i<sent.length;i++)if(t>=sent[i][0][1]-.12)si=i;if(si<0){el.innerHTML='';return}
  if(sc.id==='cta'&&si>=1){el.innerHTML='';return}
  const s=sent[si];const end=TL.vo[k][0]+TL.vo[k][1];const nx=sent[si+1]?sent[si+1][0][1]-.12:end+.6;const out=p(t,nx-.14,nx);

function live(t){const k=p(t,wt('r1',/^live/)-.05,wt('r1',/^live/)+.25);const el=$('live');el.style.opacity=k;el.style.transform=`scale(${lerp(.6,1,back(k))})`;
  el.innerHTML=`<i style="width:16px;height:16px;border-radius:50%;background:#3ec28a;box-shadow:0 0 ${10+8*Math.abs(Math.sin(t*3))}px #3ec28a;opacity:${.55+.45*Math.abs(Math.sin(t*3))}"></i><b style="font:700 26px Tight;letter-spacing:1px;color:#3ec28a">LIVE</b><span style="font:600 26px Tight;color:#d5ddeb">34,644 active tenders</span>`}
// ---------- per-scene content ----------
function ring(cx,cy,r,frac,w,col,bgc='rgba(255,255,255,.08)'){const C=2*Math.PI*r;return `<svg class="abs" style="left:${cx-r-w}px;top:${cy-r-w}px" width="${2*(r+w)}" height="${2*(r+w)}"><circle cx="${r+w}" cy="${r+w}" r="${r}" fill="none" stroke="${bgc}" stroke-width="${w}"/><circle cx="${r+w}" cy="${r+w}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 ${r+w} ${r+w})"/></svg>`}
function stamp(x,y,txt,k,col='#3ec28a'){if(k<=0)return'';return `<div class="abs" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(-8deg) scale(${lerp(2.4,1,ex(k))});opacity:${cl(k*3)};padding:14px 34px;border:5px solid ${col};border-radius:16px;font:700 54px Tight;letter-spacing:4px;color:${col};background:rgba(8,20,16,.55);box-shadow:0 0 50px ${col}55">${txt}</div>`}
const flag=c=>({KEN:'🇰🇪',TZA:'🇹🇿',ZAF:'🇿🇦',UGA:'🇺🇬'}[c]||'');
async function frame(t){
  const sc=SC.find(s=>t>=s.t0&&t<s.t1)||SC[SC.length-1];const lt=t-sc.t0,D=sc.t1-sc.t0;
  const B=TL.beat,ph=(t%B)/B,kick=Math.exp(-ph*7);const drums=t>=scene('brand').t0&&!(sc.id==='cta'&&lt>1)&&sc.id!=='meet';const pump=drums?kick:0;
  bg(t,pump,sc.id==='meet'?.6:1);$('stage').style.transform=`scale(${1+.01*pump+.02*p(lt,0,D)})`;
  $('fx').innerHTML='';$('behind').innerHTML='';$('flash').style.opacity=0;$('black').style.opacity=0;drawMap(0,0,0,0,1,0);

  let [P,pk]=poseAt(sc,lt);let extra='';$('phone').style.opacity=1;$('phone').style.filter=pk<1?`blur(${(1-pk)*(1-pk)*10}px)`:'none';
  let fx='',bh='';
  if(sc.id==='hook'){
    $('phone').style.opacity=0;
    const ign=ex(p(lt,0,.5));const rev=ex(p(lt,.4,2.6))*1.3;const zoomOut=ei(p(lt,D-.75,D));
    drawMap(t,1,1060,1250,lerp(2.3,2.0,ex(p(lt,0,D-.8)))*lerp(1,6,zoomOut),rev,null);
    bh+=`<div class="abs" style="left:540px;top:1250px;width:${30+ign*20}px;height:${30+ign*20}px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff6d8,#f0cf7a 40%,rgba(240,207,122,0) 70%);opacity:${(1-p(lt,1.4,2.2))}"></div>`;
    for(let i=0;i<3;i++){const r=p(lt,.05+i*.2,1.4+i*.2);if(r>0&&r<1)bh+=`<div class="abs" style="left:540px;top:1250px;width:${r*1400}px;height:${r*1400}px;transform:translate(-50%,-50%);border-radius:50%;border:${3*(1-r)}px solid rgba(240,207,122,${.7*(1-r)})"></div>`}
    const c0=wt('r1',/^Thirty/),c1=wt('r1',/^tenders/)+.3;const n=34644*ex(p(lt,c0-sc.t0-.05,c1-sc.t0));const nk=p(lt,c0-sc.t0-.1,c0-sc.t0+.15);const land=p(lt,c1-sc.t0-.05,c1-sc.t0+.3);
    fx+=`<div class="abs" style="left:0;right:0;top:1500px;text-align:center;opacity:${nk*(1-zoomOut)};transform:scale(${lerp(1.12,1,ex(land))})"><div class="num" style="font:700 210px Tight;letter-spacing:-8px;color:var(--gold2);text-shadow:0 0 ${40+60*(1-land)}px rgba(240,207,122,.45)">${fmt(n)}</div>
      <div style="font:600 34px Tight;color:#c9d2e3;margin-top:-10px;opacity:${p(lt,wt('r1',/^Every/)-sc.t0-.1,wt('r1',/^Every/)-sc.t0+.2)}">active tenders only · open right now</div></div>`;
    if(lt>D-.45){P=[540,1250,lerp(.05,.96,ex(p(lt,D-.45,D))),0,0,0];$('phone').style.opacity=p(lt,D-.45,D-.3);scrHTML(lockScreen(t,0))}
  } else if(sc.id==='problem'){

    const lastHit=n?notiT(n-1):-9;const sh=Math.exp(-(t-lastHit)*14)*(n?1:0);extra=`translateX(${Math.sin(t*90)*9*sh}px)`;
    const red=p(lt,D-1.2,D);scrHTML(lockScreen(t,n,red));$('front').style.boxShadow=`0 80px 160px rgba(0,0,0,.75),inset 0 0 0 2px rgba(255,255,255,.08),0 0 ${80*red}px rgba(229,83,75,${.5*red})`;
    const badge=n<NOTI.length?n*9+3:99;if(n)fx+=`<div class="abs" style="left:${540+250}px;top:${1210-560}px;transform:translate(-50%,-50%) scale(${1+.3*sh});min-width:92px;height:92px;padding:0 18px;border-radius:46px;background:#e5534b;font:700 46px/92px Tight;text-align:center;box-shadow:0 0 40px rgba(229,83,75,.7)">${n>=NOTI.length?'99+':badge}</div>`;

    $('front').style.boxShadow='0 80px 160px rgba(0,0,0,.75),inset 0 0 0 2px rgba(255,255,255,.08),0 0 120px rgba(240,207,122,.18)';
