name: tracker-push

# Writes the commodity feed into the Commodities Tracker sheet after every feed run (no AI task needed).
on:
  workflow_run:
    workflows: ["commodity-feed"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "push or check"
        default: "push"

concurrency:
  group: tracker-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: push
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then python -m feeder.sheet_push check; else python -m feeder.sheet_push; fi
