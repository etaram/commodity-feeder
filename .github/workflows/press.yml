name: press
on:
  # timed by the company server (deploy/ops/schedule.tab), not by GitHub: see deploy/ops/SCHEDULE.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: press-writes   # own group: GitHub keeps only ONE pending run per group, so sharing it with leads cancelled queued leads runs (13 Nov)
  cancel-in-progress: false
jobs:
  press:
    runs-on: ${{ vars.RUNNER_LABEL || 'sinder' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests curl_cffi certifi aia
      - run: python -m leads.news 300 1800 2>&1 | tail -40
      # buying signals from exchange announcements (SEC EDGAR 8-K / 6-K full-text search, last 14 days)
      - run: python -m leads.filings 14 2>&1 | tail -10
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads/deal_calc.csv data/leads/press.csv data/leads/cache/news.json data/leads/filings_signals.csv
          git diff --cached --quiet && exit 0
          git commit -m "press: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 5; done
