name: script
on:
  workflow_dispatch:
    inputs:
      script:
        description: "python module or file to run (e.g. tools/il_explore.py)"
        required: true
      minutes:
        description: "timeout minutes"
        required: false
        default: "40"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests curl_cffi certifi aia google-auth beautifulsoup4 lxml openpyxl
      - run: mkdir -p data/probe data/israel
      - run: timeout ${{ inputs.minutes }}m python ${{ inputs.script }} 2>&1 | tail -c 200000 > data/probe/script.log; true
      - run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/probe data/israel data/leads/partial 2>/dev/null; git add -A data/probe; git add -A data/israel || true
          git diff --cached --quiet || git commit -m "script: ${{ inputs.script }} $(date -u +%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
