name: sanctions
on:
  workflow_dispatch:
    inputs:
      runner:
        description: where to run (empty = default; sinder = the company server)
        default: ""
  # timed by the company server (deploy/ops/schedule.tab), not by GitHub: see deploy/ops/SCHEDULE.md
permissions:
  contents: write
concurrency:
  group: sanctions
jobs:
  build:
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'sinder' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python -m leads.sanctions
      - name: result fingerprint (for comparing runners)
        run: python -c "import json,hashlib;d=json.load(open('data/leads/sanctions.json'));d.pop('updated',None);print('fingerprint counts',d.get('counts'),'names',len(d.get('e',[])),'sha',hashlib.sha256(json.dumps(d,sort_keys=True).encode()).hexdigest()[:16])"
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/leads/sanctions.json; git commit -qm "sanctions index $(date -u +%F)" || exit 0
          git pull -q --rebase origin main; git push -q origin HEAD:main
