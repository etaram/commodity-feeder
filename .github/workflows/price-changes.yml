name: price-changes
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-changes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m leads.price_changes
      - name: Commit data
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/leads/price_changes.json data/leads/price_history.csv
          git diff --cached --quiet || git commit -m "data: price changes $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
