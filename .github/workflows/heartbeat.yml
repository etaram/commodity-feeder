name: heartbeat
# The scheduler of the timed workflows. GitHub skips or delays scheduled runs on this repository, so this job stays
# alive for ~5h45m on a GitHub-hosted machine (free for a public repository, it does not hold one of the company's
# runners) and every 5 minutes starts the workflows whose time has come in deploy/ops/schedule.tab, with this job's
# own token (deploy/ops/scheduler/sched.py dispatch). Then it starts its own next copy. Its own schedule below only
# restarts the chain if a copy ever fails to start the next one. See deploy/ops/SCHEDULE.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = only print what would be started, for a few minutes, and do not start the next copy"
        required: false
        default: ""
  schedule:
    - cron: "17 */6 * * *"
permissions:
  actions: write
  contents: read
concurrency:
  group: ${{ inputs.dry_run == 'yes' && format('heartbeat-test-{0}', github.run_id) || 'heartbeat' }}
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          SCHED_REPO: ${{ github.repository }}
          SCHED_STATE: ${{ runner.temp }}/sched
          SCHED_LOG: ${{ runner.temp }}/sched.log
          DRY: ${{ inputs.dry_run == 'yes' && '--dry-run' || '' }}
        run: |
          minutes=345; [ -n "$DRY" ] && minutes=11
          end=$(( $(date +%s) + minutes*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python3 deploy/ops/scheduler/sched.py dispatch $DRY || echo "dispatch tick failed"
            sleep $(( 320 - $(date +%s) % 300 ))      # next tick 20 seconds after the next 5-minute mark
          done
          [ -n "$DRY" ] || gh workflow run heartbeat.yml --repo "$SCHED_REPO" --ref main
