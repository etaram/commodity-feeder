name: biztrends
# Business trends for the Today screen every 8 hours (owner, 14 Nov 2026): China's financial wires and hot lists plus
# trending searches in 40 countries, business items only (leads/biz_trends.py), pushed to the 'Biz Trends' tab the
# panel reads, and committed (data/leads/biz_trends.csv and its momentum history).
on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: biztrends
  cancel-in-progress: false
jobs:
  trends:
    runs-on: ${{ vars.RUNNER_LABEL || 'sinder' }}
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/pip
          key: argos-v1
      - run: pip install requests pycountry langid argostranslate certifi google-auth
      - run: python -m leads.biz_trends
      - run: python -m leads.push tab "Biz Trends" biz_trends
      - name: commit
        run: |
          git config user.name "leads-bot"; git config user.email "leads-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            cp data/leads/biz_trends.csv /tmp/bt.csv; cp data/leads/cache/biz_trends_history.json /tmp/bth.json 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/bt.csv data/leads/biz_trends.csv; mkdir -p data/leads/cache; cp /tmp/bth.json data/leads/cache/biz_trends_history.json 2>/dev/null || true
            git add data/leads/biz_trends.csv data/leads/cache/biz_trends_history.json
            git diff --cached --quiet && exit 0
            git commit -q -m "biztrends: business trends refresh" && git push -q origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
