name: audit-sheets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-auth requests && python tools/audit/sheets_latency.py && python tools/audit/sheets_lock.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
