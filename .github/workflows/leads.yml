        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',us_awards,') }}
        timeout-minutes: 15
        continue-on-error: true
        run: set -o pipefail; python -m leads.sam_awards 90 60 2>&1 | tee -a data/leads/run.log
      - name: merge
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,') }}
        # a hard crash (signal) writes no error file by itself; record it so health turns the run red
        run: set -o pipefail; python -m leads.run --merge 2>&1 | tee -a data/leads/run.log || { rc=$?; echo "merge exited with code $rc at $(date -u +%FT%TZ)" > data/leads/error_merge.txt; exit $rc; }
        timeout-minutes: 90
        continue-on-error: true
      - name: runtime manifest (per source fetched / snapshot / active / published, open-file hash; counts only)
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,') }}
        continue-on-error: true
        timeout-minutes: 10
        run: python -m leads.manifest 2>&1 | tail -3 | tee -a data/leads/run.log
      - name: commodities (normalise, stats; code only)
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,') }}
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          set -o pipefail
          # physical prices by origin and grade: refreshed when older than 6 hours or when a new source was added
          AGE=$(( $(date +%s) - $(git log -1 --format=%ct -- data/leads/origin_prices.csv 2>/dev/null || echo 0) ))
          if [ ! -f data/leads/origin_prices.csv ] || [ $AGE -gt 21600 ] || ! python -m leads.origin_prices --complete; then
            pip install -q pdfplumber beautifulsoup4 lxml openpyxl pycountry && python -m leads.origin_prices 2>&1 | tail -3 | tee -a data/leads/run.log || true
          fi
          python -m leads.commodity_norm 2>&1 | tail -2 | tee -a data/leads/run.log
          python -m leads.commodity_stats 2>&1 | tail -2 | tee -a data/leads/run.log
        timeout-minutes: 25
        continue-on-error: true
      - name: news
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',news,') || contains(format(',{0},', env.ONLY), ',merge,') }}
        timeout-minutes: 10
        continue-on-error: true
        run: set -o pipefail; python -m leads.news 2>&1 | tee -a data/leads/run.log
      - name: push
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',push,')) }}
        run: |
          set -o pipefail
          python -m leads.push check 2>&1 | tee -a data/leads/run.log
          python -m leads.push leads 2>&1 | tee -a data/leads/run.log
        continue-on-error: true
      - name: webindex
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,') || contains(format(',{0},', env.ONLY), ',webindex,') }}
        run: set -o pipefail; python -m leads.webindex tenders 2>&1 | tee -a data/leads/run.log
        continue-on-error: true
      - name: webpanel
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',push,') || contains(format(',{0},', env.ONLY), ',webpanel,')) }}
        run: set -o pipefail; python -m leads.webpanel static live 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: health
        if: ${{ always() && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,')) }}
        # health exits 1 when the merge failed (error_merge.txt): an empty or halved merge turns the run red here,
        # after the remaining steps and before the commit, which still runs (always())
        run: set -o pipefail; python -m leads.source_status 2>&1 | tee -a data/leads/run.log; python -m leads.health 2>&1 | tee -a data/leads/run.log
      - name: source quality (freshness, completeness, duplicates, expired)
        if: ${{ always() && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,')) }}
        run: python -m leads.source_quality 2>&1 | tail -1 | tee -a data/leads/run.log
        continue-on-error: true
      - name: world events, project timelines and hypotheses (code only, no model)
        if: ${{ always() && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,')) }}
        run: python -m leads.events 2>&1 | tail -3 | tee -a data/leads/run.log; python -m leads.hypotheses 2>&1 | tail -3 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: registry
        if: ${{ always() && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,')) }}
        run: python -m leads.registry 2>&1 | tee -a data/leads/run.log || true
      - name: commit
        if: ${{ always() }}
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/leads data/web data/registry
          git diff --cached --quiet || git commit -m "leads: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 5; done
