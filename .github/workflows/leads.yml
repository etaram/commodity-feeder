      - name: us_awards
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',us_awards,') }}
        timeout-minutes: 15
        continue-on-error: true
        run: set -o pipefail; python -m leads.sam_awards 90 60 2>&1 | tee -a data/leads/run.log
      - name: merge
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,') }}
        run: set -o pipefail; python -m leads.run --merge 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 90
        continue-on-error: true
      - name: news
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',news,') || contains(format(',{0},', env.ONLY), ',merge,') }}
        timeout-minutes: 10
        continue-on-error: true
        run: set -o pipefail; python -m leads.news 2>&1 | tee -a data/leads/run.log
      - name: push
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',push,')) }}
        run: |
          set -o pipefail
          python -m leads.push check 2>&1 | tee -a data/leads/run.log
          python -m leads.push leads 2>&1 | tee -a data/leads/run.log
        continue-on-error: true
      - name: webindex
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,') || contains(format(',{0},', env.ONLY), ',webindex,') }}
        run: set -o pipefail; python -m leads.webindex tenders 2>&1 | tee -a data/leads/run.log
        continue-on-error: true
      - name: webpanel
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',push,') || contains(format(',{0},', env.ONLY), ',webpanel,')) }}
        run: set -o pipefail; python -m leads.webpanel static live 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: health
        if: ${{ always() && (env.ONLY == '' || contains(format(',{0},', env.ONLY), ',merge,')) }}
        run: set -o pipefail; python -m leads.health 2>&1 | tee -a data/leads/run.log
      - name: commit
        if: ${{ always() }}
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/leads data/web
          git diff --cached --quiet || git commit -m "leads: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
