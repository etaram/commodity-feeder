name: leads
on:
  # timed by the company server (deploy/ops/schedule.tab), not by GitHub: see deploy/ops/SCHEDULE.md
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated steps to run (empty = all; light or heavy = the timed sets)"
        required: false
        default: ""
      ted_full:
        description: "1 = TED sweeps every notice with a future deadline in this run (otherwise only the first run after 00:00 UTC)"
        required: false
        default: ""
      allow_shrink:
        description: "1 = accept an empty or halved merged list (otherwise the merge fails and the run is red)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: repo-data-writes
  cancel-in-progress: false
jobs:
  leads:
    runs-on: ${{ vars.RUNNER_LABEL || 'sinder' }}
    timeout-minutes: 160
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CHILE_TICKET: ${{ secrets.CHILE_TICKET }}
      ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
      LEADS_ALLOW_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/pip
          key: argos-v1
      - uses: actions/cache@v4
        with:
          path: data/private
          key: private-${{ github.run_id }}
          restore-keys: private-
      - run: pip install requests curl_cffi pycountry langid argostranslate aia certifi google-auth openpyxl cryptography phonenumbers
      - run: mkdir -p data/leads && date -u > data/leads/run.log
      - name: plan
        run: |
          LIGHT="transnet,bonfire,ted,fts,sam,canadabuys,ungm,undp,ebrd,aiib,isdb,afdb,iadb,simap,gets,etimad,prozorro,pncp,secop,contractsfinder,austender,oman,qatar,kenya,rwanda,uganda,ghana,malawi,mozambique,dubai,philippines,moldova,uruguay,malaysia,merge,push,webpanel"
          HEAVY="bidnet,kkj,bahrain,nyc,us_cities,za,chile,india,grants,germany,paraguay,dominican,france,spain,dewa,csg,ccgp,lebanon,cameroon,awards,wb_pipeline,worldbank,mrgov,importyeti,markets,enrich,us_awards,merge,push,webpanel"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "10 */2 * * *" ]; then echo "ONLY=$LIGHT" >> $GITHUB_ENV; else echo "ONLY=$HEAVY" >> $GITHUB_ENV; fi
          fi
          # the company server starts the timed runs with only=light or only=heavy (deploy/ops/schedule.tab)
          if [ "$ONLY" = "light" ]; then echo "ONLY=$LIGHT" >> $GITHUB_ENV; elif [ "$ONLY" = "heavy" ]; then echo "ONLY=$HEAVY" >> $GITHUB_ENV; fi
      - name: ted
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',ted,') }}
        run: set -o pipefail; python -m leads.run --source ted 2>&1 | tee -a data/leads/run.log
        env:
          TED_FULL: ${{ inputs.ted_full }}
        timeout-minutes: 35
        continue-on-error: true
      - name: fts
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',fts,') }}
        run: set -o pipefail; python -m leads.run --source fts 2>&1 | tee -a data/leads/run.log
