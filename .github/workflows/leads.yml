name: leads
on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated steps to run (empty = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: repo-data-writes
  cancel-in-progress: false
jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/pip
          key: argos-v1
      - uses: actions/cache@v4
        with:
          path: data/private
          key: private-${{ github.run_id }}
          restore-keys: private-
      - run: pip install requests curl_cffi pycountry langid argostranslate aia certifi google-auth
      - run: mkdir -p data/leads && date -u > data/leads/run.log
      - name: ted
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',ted,') }}
        run: set -o pipefail; python -m leads.run --source ted 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 20
        continue-on-error: true
      - name: fts
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',fts,') }}
        run: set -o pipefail; python -m leads.run --source fts 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: sam
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',sam,') }}
        run: set -o pipefail; python -m leads.run --source sam 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 15
        continue-on-error: true
      - name: canadabuys
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',canadabuys,') }}
        run: set -o pipefail; python -m leads.run --source canadabuys 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 6
        continue-on-error: true
      - name: za
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',za,') }}
        run: set -o pipefail; python -m leads.run --source za 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: ebrd
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',ebrd,') }}
        run: set -o pipefail; python -m leads.run --source ebrd 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 5
        continue-on-error: true
      - name: ungm
