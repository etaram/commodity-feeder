name: leads
on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-data-writes
  cancel-in-progress: false
jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/pip
          key: argos-v1
      - run: pip install requests curl_cffi pycountry langid argostranslate
      - name: ted
        run: python -m leads.run --source ted
        timeout-minutes: 20
        continue-on-error: true
      - name: fts
        run: python -m leads.run --source fts
        timeout-minutes: 10
        continue-on-error: true
      - name: sam
        run: python -m leads.run --source sam
        timeout-minutes: 15
        continue-on-error: true
      - name: canadabuys
        run: python -m leads.run --source canadabuys
        timeout-minutes: 6
        continue-on-error: true
      - name: za
        run: python -m leads.run --source za
        timeout-minutes: 8
        continue-on-error: true
      - name: ebrd
        run: python -m leads.run --source ebrd
        timeout-minutes: 5
        continue-on-error: true
      - name: ungm
        run: python -m leads.run --source ungm
        timeout-minutes: 12
        continue-on-error: true
      - name: undp
        run: python -m leads.run --source undp
        timeout-minutes: 4
        continue-on-error: true
      - name: aiib
        run: python -m leads.run --source aiib
        timeout-minutes: 4
        continue-on-error: true
      - name: isdb
        run: python -m leads.run --source isdb
        timeout-minutes: 4
        continue-on-error: true
      - name: etimad
        run: python -m leads.run --source etimad
        timeout-minutes: 10
        continue-on-error: true
      - name: prozorro
        run: python -m leads.run --source prozorro
        timeout-minutes: 20
        continue-on-error: true
      - name: pncp
        run: python -m leads.run --source pncp
        timeout-minutes: 12
        continue-on-error: true
      - name: secop
        run: python -m leads.run --source secop
        timeout-minutes: 5
        continue-on-error: true
      - name: germany
        run: python -m leads.run --source germany
        timeout-minutes: 15
        continue-on-error: true
      - name: contractsfinder
        run: python -m leads.run --source contractsfinder
        timeout-minutes: 8
        continue-on-error: true
      - name: paraguay
        run: python -m leads.run --source paraguay
        timeout-minutes: 10
        continue-on-error: true
      - name: dominican
        run: python -m leads.run --source dominican
        timeout-minutes: 10
        continue-on-error: true
      - name: austender
        run: python -m leads.run --source austender
        timeout-minutes: 4
        continue-on-error: true
      - name: oman
        run: python -m leads.run --source oman
        timeout-minutes: 4
        continue-on-error: true
      - name: awards
        run: python -m leads.run --source awards
        timeout-minutes: 15
        continue-on-error: true
      - name: worldbank
        run: python -m leads.run --source worldbank
        timeout-minutes: 10
        continue-on-error: true
      - name: mrgov
        run: python -m leads.run --source mrgov
        timeout-minutes: 10
        continue-on-error: true
      - name: importyeti
        run: python -m leads.run --source importyeti
        timeout-minutes: 15
        continue-on-error: true
      - name: markets
        run: python -m leads.run --source markets
        timeout-minutes: 8
        continue-on-error: true
      - name: enrich
        run: python -m leads.run --source enrich
        timeout-minutes: 10
        continue-on-error: true
      - name: merge
        run: python -m leads.run --merge
        timeout-minutes: 45
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/leads
          git diff --cached --quiet || git commit -m "leads: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
