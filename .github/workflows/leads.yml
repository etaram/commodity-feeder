name: leads
on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-data-writes
  cancel-in-progress: false
jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/pip
          key: argos-v1
      - run: pip install requests curl_cffi pycountry langid argostranslate
      - run: mkdir -p data/leads && date -u > data/leads/run.log
      - name: ted
        run: set -o pipefail; python -m leads.run --source ted 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 20
        continue-on-error: true
      - name: fts
        run: set -o pipefail; python -m leads.run --source fts 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: sam
        run: set -o pipefail; python -m leads.run --source sam 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 15
        continue-on-error: true
      - name: canadabuys
        run: set -o pipefail; python -m leads.run --source canadabuys 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 6
        continue-on-error: true
      - name: za
        run: set -o pipefail; python -m leads.run --source za 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: ebrd
        run: set -o pipefail; python -m leads.run --source ebrd 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 5
        continue-on-error: true
      - name: ungm
        run: set -o pipefail; python -m leads.run --source ungm 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 12
        continue-on-error: true
      - name: undp
        run: set -o pipefail; python -m leads.run --source undp 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 4
        continue-on-error: true
      - name: aiib
        run: set -o pipefail; python -m leads.run --source aiib 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 4
        continue-on-error: true
      - name: isdb
        run: set -o pipefail; python -m leads.run --source isdb 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 4
        continue-on-error: true
      - name: etimad
        run: set -o pipefail; python -m leads.run --source etimad 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: prozorro
        run: set -o pipefail; python -m leads.run --source prozorro 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 20
        continue-on-error: true
      - name: pncp
        run: set -o pipefail; python -m leads.run --source pncp 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 12
        continue-on-error: true
      - name: secop
        run: set -o pipefail; python -m leads.run --source secop 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 5
        continue-on-error: true
      - name: germany
        run: set -o pipefail; python -m leads.run --source germany 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 15
        continue-on-error: true
      - name: contractsfinder
        run: set -o pipefail; python -m leads.run --source contractsfinder 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: paraguay
        run: set -o pipefail; python -m leads.run --source paraguay 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: dominican
        run: set -o pipefail; python -m leads.run --source dominican 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: austender
        run: set -o pipefail; python -m leads.run --source austender 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 4
        continue-on-error: true
      - name: oman
        run: set -o pipefail; python -m leads.run --source oman 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 4
        continue-on-error: true
      - name: france
        run: set -o pipefail; python -m leads.run --source france 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: spain
        run: set -o pipefail; python -m leads.run --source spain 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 15
        continue-on-error: true
      - name: kenya
        run: set -o pipefail; python -m leads.run --source kenya 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: tanzania
        run: set -o pipefail; python -m leads.run --source tanzania 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: ghana
        run: set -o pipefail; python -m leads.run --source ghana 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: zambia
        run: set -o pipefail; python -m leads.run --source zambia 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: awards
        run: set -o pipefail; python -m leads.run --source awards 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 15
        continue-on-error: true
      - name: worldbank
        run: set -o pipefail; python -m leads.run --source worldbank 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: mrgov
        run: set -o pipefail; python -m leads.run --source mrgov 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: importyeti
        run: set -o pipefail; python -m leads.run --source importyeti 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 15
        continue-on-error: true
      - name: markets
        run: set -o pipefail; python -m leads.run --source markets 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: enrich
        run: set -o pipefail; python -m leads.run --source enrich 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: merge
        run: set -o pipefail; python -m leads.run --merge 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 45
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/leads
          git diff --cached --quiet || git commit -m "leads: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
