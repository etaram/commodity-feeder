name: leads
on:
  schedule:
    - cron: "10 */2 * * *"
    - cron: "40 4,16 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated steps to run (empty = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: repo-data-writes
  cancel-in-progress: false
jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CHILE_TICKET: ${{ secrets.CHILE_TICKET }}
      ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/pip
          key: argos-v1
      - uses: actions/cache@v4
        with:
          path: data/private
          key: private-${{ github.run_id }}
          restore-keys: private-
      - run: pip install requests curl_cffi pycountry langid argostranslate aia certifi google-auth openpyxl cryptography
      - run: mkdir -p data/leads && date -u > data/leads/run.log
      - name: plan
        run: |
          LIGHT="ted,fts,sam,canadabuys,ungm,undp,ebrd,aiib,isdb,afdb,iadb,simap,gets,etimad,prozorro,pncp,secop,contractsfinder,austender,oman,qatar,kenya,moldova,uruguay,merge,push,webpanel"
          HEAVY="bahrain,malaysia,nyc,us_cities,za,chile,india,grants,germany,paraguay,dominican,france,spain,awards,wb_pipeline,worldbank,mrgov,importyeti,markets,enrich,us_awards,merge,push,webpanel"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "10 */2 * * *" ]; then echo "ONLY=$LIGHT" >> $GITHUB_ENV; else echo "ONLY=$HEAVY" >> $GITHUB_ENV; fi
          fi
      - name: ted
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',ted,') }}
        run: set -o pipefail; python -m leads.run --source ted 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 20
        continue-on-error: true
      - name: fts
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',fts,') }}
        run: set -o pipefail; python -m leads.run --source fts 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: sam
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',sam,') }}
        run: set -o pipefail; python -m leads.run --source sam 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 25
        continue-on-error: true
      - name: nyc
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',nyc,') }}
        run: set -o pipefail; python -m leads.run --source nyc 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 6
        continue-on-error: true
      - name: us_cities
        if: ${{ env.ONLY == '' || contains(format(',{0},', env.ONLY), ',us_cities,') }}
        run: set -o pipefail; pip install -q beautifulsoup4 lxml; python -m leads.run --source us_cities 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 15
        continue-on-error: true
      - name: canadabuys
