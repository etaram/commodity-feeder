      - name: markets
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',markets,') }}
        run: set -o pipefail; python -m leads.run --source markets 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 8
        continue-on-error: true
      - name: enrich
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',enrich,') }}
        run: set -o pipefail; python -m leads.run --source enrich 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 10
        continue-on-error: true
      - name: merge
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',merge,') }}
        run: set -o pipefail; python -m leads.run --merge 2>&1 | tee -a data/leads/run.log
        timeout-minutes: 45
        continue-on-error: true
      - name: push
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && (inputs.only == '' || contains(format(',{0},', inputs.only), ',push,')) }}
        run: |
          set -o pipefail
          python -m leads.push check 2>&1 | tee -a data/leads/run.log
          python -m leads.push leads 2>&1 | tee -a data/leads/run.log
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/leads
          git diff --cached --quiet || git commit -m "leads: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
