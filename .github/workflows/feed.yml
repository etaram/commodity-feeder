name: commodity-feed

on:
  schedule:
    # 07:40 and 23:10 Israel time in winter (UTC+2). The sheet imports at 08:05 and 23:35.
    - cron: "40 5 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commodity-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
      COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: yahoo
        run: python -m feeder.run --source yahoo
        timeout-minutes: 4
        continue-on-error: true
      - name: westmetall
        run: python -m feeder.run --source westmetall
        timeout-minutes: 4
        continue-on-error: true
      - name: em_global
        run: python -m feeder.run --source em_global
        timeout-minutes: 4
        continue-on-error: true
      - name: cn_spot
        run: python -m feeder.run --source cn_spot
        timeout-minutes: 6
        continue-on-error: true
      - name: eu_agri
        run: python -m feeder.run --source eu_agri
        timeout-minutes: 6
        continue-on-error: true
      - name: dtn
        run: python -m feeder.run --source dtn
        timeout-minutes: 4
        continue-on-error: true
      - name: ssb
        run: python -m feeder.run --source ssb
        timeout-minutes: 3
        continue-on-error: true
      - name: scrapmonster
        run: python -m feeder.run --source scrapmonster
        timeout-minutes: 4
        continue-on-error: true
      - name: smi
        run: python -m feeder.run --source smi
        timeout-minutes: 3
        continue-on-error: true
      - name: census
        run: python -m feeder.run --source census
        timeout-minutes: 10
        continue-on-error: true
      - name: comext
        run: python -m feeder.run --source comext
        timeout-minutes: 12
        continue-on-error: true
      - name: comtrade
        run: python -m feeder.run --source comtrade
        timeout-minutes: 12
        continue-on-error: true
      - name: merge
        run: python -m feeder.run --merge
        continue-on-error: true
      - name: monitor
        run: python -m feeder.monitor
        timeout-minutes: 8
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.csv data/benchmark_map.csv data/candidates.csv data/run_log.json data/source_health.csv data/source_health.json data/raw data/import data/merge_error.txt || true
          git diff --cached --quiet || git commit -m "data: feed run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
