name: commodity-feed

on:
  schedule:
    # Israel time 07:40 and 23:10 in winter (UTC+2); 08:40 / 00:10 in summer (UTC+3).
    # The sheet updates at 08:00 and 23:30, so fresh data is waiting for it.
    - cron: "40 5 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sources to run (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: commodity-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch prices
        env:
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
        run: python -m feeder.run --only "${{ github.event.inputs.only }}"
      - name: Commit data
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.csv data/candidates.csv data/run_log.json
          git diff --cached --quiet || git commit -m "data: feed run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
