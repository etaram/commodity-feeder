name: coffee-sellers
# Coffee producers, cooperatives and exporters from public marketplace seller profiles (leads/coffee_sellers.py).
# A few hundred profiles a run, resumes where it stopped. Public profile facts only.
on:
  schedule:
    - cron: "35 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coffee-sellers
  cancel-in-progress: false
jobs:
  run:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pycountry pdfplumber
      - run: python -m leads.coffee_sellers --max 500 --minutes 14 2>&1 | tail -3
      - name: Official exporter registries (weekly)
        timeout-minutes: 40
        run: |
          if [ ! -f data/leads/registry_cameroon.csv ] || [ $(( $(date +%s) - $(git log -1 --format=%ct -- data/leads/registry_cameroon.csv || echo 0) )) -gt 604800 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python -m leads.registries 2>&1 | grep -E 'registry|registries' | tail -40; fi
        continue-on-error: true
      - name: APEDA India exporters (25 minutes a run, resumes where it stopped)
        timeout-minutes: 30
        run: python -m leads.registries india 2>&1 | grep -E 'registry|registries|india' | tail -10
        continue-on-error: true
      - name: Uganda official directory (weekly)
        run: |
          if [ ! -f data/leads/uganda_directory.csv ] || [ $(( $(date +%s) - $(git log -1 --format=%ct -- data/leads/uganda_directory.csv || echo 0) )) -gt 604800 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python -m leads.uganda_directory 2>&1 | tail -8; fi
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "commodity-feed-bot"; git config user.email "actions@users.noreply.github.com"
          cp data/leads/coffee_sellers.csv /tmp/cs.csv; cp data/leads/coffee_sellers_state.json /tmp/cs.json; cp data/leads/uganda_directory.csv /tmp/ud.csv 2>/dev/null || true; mkdir -p /tmp/reg && cp data/leads/registry_*.csv data/leads/registry_india_state.json /tmp/reg/ 2>/dev/null || true
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/cs.csv data/leads/coffee_sellers.csv && cp /tmp/cs.json data/leads/coffee_sellers_state.json; cp /tmp/ud.csv data/leads/uganda_directory.csv 2>/dev/null || true; cp /tmp/reg/registry_*.csv /tmp/reg/registry_india_state.json data/leads/ 2>/dev/null || true
            git add data/leads/coffee_sellers.csv data/leads/coffee_sellers_state.json; git add data/leads/uganda_directory.csv 2>/dev/null || true; git add data/leads/registry_*.csv data/leads/registry_india_state.json 2>/dev/null || true; python -m leads.coverage_board >/dev/null 2>&1 || true; git add data/leads/coverage_board.csv 2>/dev/null || true; git diff --cached --quiet && break
            git commit -q -m "coffee sellers: $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin HEAD:main && break
            sleep $((i * 8))
          done
