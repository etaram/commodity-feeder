name: coffee-sellers
# Coffee producers, cooperatives and exporters from public marketplace seller profiles (leads/coffee_sellers.py).
# A few hundred profiles a run, resumes where it stopped. Public profile facts only.
on:
  schedule:
    - cron: "35 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coffee-sellers
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pycountry pdfplumber
      - run: python -m leads.coffee_sellers --max 500 --minutes 14 2>&1 | tail -3
      - name: Official exporter registries (weekly)
        run: |
          if [ ! -f data/leads/registry_cameroon.csv ] || [ -n "$(find data/leads/registry_cameroon.csv -mtime +7)" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python -m leads.registries 2>&1 | tail -3; fi
        continue-on-error: true
      - name: Uganda official directory (weekly)
        run: |
          if [ ! -f data/leads/uganda_directory.csv ] || [ -n "$(find data/leads/uganda_directory.csv -mtime +7)" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python -m leads.uganda_directory 2>&1 | tail -8; fi
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "commodity-feed-bot"; git config user.email "actions@users.noreply.github.com"
          cp data/leads/coffee_sellers.csv /tmp/cs.csv; cp data/leads/coffee_sellers_state.json /tmp/cs.json; cp data/leads/uganda_directory.csv /tmp/ud.csv 2>/dev/null || true; mkdir -p /tmp/reg && cp data/leads/registry_*.csv /tmp/reg/ 2>/dev/null || true
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/cs.csv data/leads/coffee_sellers.csv && cp /tmp/cs.json data/leads/coffee_sellers_state.json; cp /tmp/ud.csv data/leads/uganda_directory.csv 2>/dev/null || true; cp /tmp/reg/registry_*.csv data/leads/ 2>/dev/null || true
            git add data/leads/coffee_sellers.csv data/leads/coffee_sellers_state.json; git add data/leads/uganda_directory.csv 2>/dev/null || true; git add data/leads/registry_*.csv 2>/dev/null || true; git diff --cached --quiet && break
            git commit -q -m "coffee sellers: $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin HEAD:main && break
            sleep $((i * 8))
          done
