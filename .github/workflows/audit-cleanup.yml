name: audit-cleanup
on:
  workflow_dispatch:
    inputs:
      state_sheet: { description: 'state sheet id (empty: print the service account only)', required: false, default: '' }
      tabs: { description: 'comma list of tabs (empty = the first set)', required: false, default: '' }
permissions:
  contents: read
jobs:
  run:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-auth requests && python tools/audit/state_migrate.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          STATE_SHEET_ID: ${{ inputs.state_sheet }}
          TABS: ${{ inputs.tabs }}
