name: suppliers
on:
  schedule:
    - cron: "40 1 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated steps to run (empty = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: repo-data-writes
  cancel-in-progress: false
jobs:
  suppliers:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/pip
          key: argos-v1
      - uses: actions/cache@v4
        with:
          path: data/private
          key: private-${{ github.run_id }}
          restore-keys: private-
      - run: pip install requests curl_cffi pycountry langid argostranslate aia certifi google-auth cryptography
      - run: mkdir -p data/leads && date -u > data/leads/run_suppliers.log
      - name: latam_awards
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',latam_awards,') }}
        run: set -o pipefail; python -m leads.run --source latam_awards 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 20
        continue-on-error: true
      - name: prozorro_awards
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',prozorro_awards,') }}
        run: set -o pipefail; python -m leads.run --source prozorro_awards 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 16
        continue-on-error: true
      - name: ocdr
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',ocdr,') }}
        run: set -o pipefail; python -m leads.run --source ocdr 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: ocdr_tenders
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',ocdr_tenders,') }}
        run: set -o pipefail; python -m leads.run --source ocdr_tenders 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: ext_awards
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',ext_awards,') }}
        run: set -o pipefail; python -m leads.run --source ext_awards 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: commodity_producers
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',commodity_producers,') }}
        run: set -o pipefail; python -m leads.run --source commodity_producers 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 20
        continue-on-error: true
      - name: wikidata_companies
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',wikidata_companies,') }}
        run: set -o pipefail; python -m leads.run --source wikidata_companies 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 16
        continue-on-error: true
      - name: web_contacts
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',web_contacts,') }}
        run: set -o pipefail; python -m leads.run --source web_contacts 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: universe
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',universe,') }}
        run: set -o pipefail; python -m leads.universe 2>&1 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: push
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && (inputs.only == '' || contains(format(',{0},', inputs.only), ',push,')) }}
        run: set -o pipefail; python -m leads.push universe 2>&1 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: webindex
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',webindex,') || contains(format(',{0},', inputs.only), ',universe,') }}
        run: set -o pipefail; python -m leads.webindex suppliers 2>&1 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data/web
          git add -A data/leads/awards data/leads/companies data/leads/run_suppliers.log data/web data/leads/partial/ocdr_tenders.json data/leads/cache/ocdr_tenders.json
          git diff --cached --quiet || git commit -m "suppliers: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
