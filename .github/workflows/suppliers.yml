name: suppliers
on:
  # timed by the company server (deploy/ops/schedule.tab), not by GitHub: see deploy/ops/SCHEDULE.md
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated steps to run (empty = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  # its own queue: the commit step lands only the files this workflow owns on top of the latest main, so it does not
  # need to wait behind the two-hourly leads runs (whose queued run used to cancel a waiting supplier rebuild)
  group: suppliers-writes
  cancel-in-progress: false
jobs:
  suppliers:
    runs-on: ${{ vars.RUNNER_LABEL || 'sinder' }}
    timeout-minutes: 300  # the universe rebuild runs last and needs 30-45 min; 150 cut it off from 7 Nov
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/pip
          key: argos-v1
      - uses: actions/cache@v4
        with:
          path: data/private
          key: private-${{ github.run_id }}
          restore-keys: private-
      - name: Company checks (read-only, written by the company-check workflow)
        uses: actions/cache/restore@v4
        with:
          path: data/checks
          key: checks-none
          restore-keys: checks-
      - name: GLEIF bulk matches (read-only, written by the sources workflow, task gleif)
        uses: actions/cache/restore@v4
        with:
          path: data/gleif
          key: gleif-none
          restore-keys: gleif-
      - name: Company descriptions (read-only, written by the describe workflow)
        uses: actions/cache/restore@v4
        with:
          path: data/describe
          key: describe-none
          restore-keys: describe-
      - run: pip install requests curl_cffi pycountry langid argostranslate aia certifi google-auth cryptography phonenumbers
      - run: mkdir -p data/leads && date -u > data/leads/run_suppliers.log
      - name: latam_awards
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',latam_awards,') }}
        run: set -o pipefail; python -m leads.run --source latam_awards 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 20
        continue-on-error: true
      - name: prozorro_awards
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',prozorro_awards,') }}
        run: set -o pipefail; python -m leads.run --source prozorro_awards 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 16
        continue-on-error: true
      - name: iadb_awards
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',iadb_awards,') }}
        run: set -o pipefail; python -m leads.run --source iadb_awards 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 20
        continue-on-error: true
      - name: gebiz_awards
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',gebiz_awards,') }}
        run: set -o pipefail; python -m leads.run --source gebiz_awards 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 15
        continue-on-error: true
      - name: ocdr
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',ocdr,') }}
        run: set -o pipefail; python -m leads.run --source ocdr 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: ocdr_tenders
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',ocdr_tenders,') }}
        run: set -o pipefail; python -m leads.run --source ocdr_tenders 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: il_exemptions
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',il_exemptions,') }}
        run: set -o pipefail; python -m leads.run --source il_exemptions 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 15
        continue-on-error: true
      - name: ext_awards
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',ext_awards,') }}
        run: set -o pipefail; python -m leads.run --source ext_awards 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: commodity_producers
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',commodity_producers,') }}
        run: set -o pipefail; python -m leads.run --source commodity_producers 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 20
        continue-on-error: true
      - name: wikidata_companies
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',wikidata_companies,') }}
        run: set -o pipefail; python -m leads.run --source wikidata_companies 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 16
        continue-on-error: true
      - name: listed_companies
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',listed_companies,') }}
        run: set -o pipefail; python -m leads.run --source listed_companies 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 16
        continue-on-error: true
      - name: web_contacts
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',web_contacts,') }}
        run: set -o pipefail; python -m leads.run --source web_contacts 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: supplier source status (rows each module wrote, staleness)
        run: python -m leads.source_status --suppliers 2>&1 | tail -15 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: proven snapshot (suppliers listed before this build)
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',universe,') }}
        run: set -o pipefail; python -m leads.proven snapshot 2>&1 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: universe
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',universe,') }}
        run: set -o pipefail; python -m leads.universe 2>&1 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: proven report (award-proven suppliers added; queue for the website check and the enrichment)
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',universe,') }}
        run: set -o pipefail; python -m leads.proven report 2>&1 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: push
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && (inputs.only == '' || contains(format(',{0},', inputs.only), ',push,')) }}
        run: set -o pipefail; python -m leads.push universe 2>&1 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: origin exporters (trade directories, resumes weekly)
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',origin_exporters,') }}
        run: set -o pipefail; python -m leads.origin_exporters 2>&1 | tail -5 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 55
        continue-on-error: true
      - name: webindex
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',webindex,') || contains(format(',{0},', inputs.only), ',universe,') || contains(format(',{0},', inputs.only), ',origin_exporters,') }}
        run: set -o pipefail; python -m leads.webindex suppliers 2>&1 | tee -a data/leads/run_suppliers.log
        continue-on-error: true
      - name: winners (fresh contract winners as sales leads)
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',winners,') || contains(format(',{0},', inputs.only), ',ext_awards,') }}
        run: set -o pipefail; python -m leads.winners 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: footprints (company and buyer profiles from award records)
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',footprints,') }}
        run: set -o pipefail; python -m leads.footprints 2>&1 | tee -a data/leads/run_suppliers.log
        timeout-minutes: 30
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data/web
          P="data/leads/awards data/leads/companies data/leads/run_suppliers.log data/leads/source_status_suppliers.json data/leads/supplier_sectors.csv data/leads/supplier_hs.csv data/web/suppliers.enc data/web/winners.enc data/web/footprints data/leads/partial/ocdr_tenders.json data/leads/cache/ocdr_tenders.json data/leads/il_exempt.csv data/leads/proven_report.json"
          # keep a copy of what this workflow owns, then land it on top of the latest main (other workflows push meanwhile)
          rm -rf /tmp/own && mkdir -p /tmp/own
          for f in $P; do [ -e "$f" ] && cp -r --parents "$f" /tmp/own/; done
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/own/. .
            for f in $P; do [ -e "$f" ] && git add -A "$f"; done   # a file a skipped step did not write must not fail the commit
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "suppliers: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((i * 10))
          done
          [ "$ok" = 1 ] || { echo "push failed after 5 attempts"; exit 1; }
