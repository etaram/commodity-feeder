name: company-check
# Background company checks, official-register identity checks and data refinement (leads/company_check.py, leads/registry_check.py, leads/refine.py): reads suppliers' own
# websites and refines every supplier record in code; only the counts (data/leads/refine_progress.json) are public.
# Every hour (public repository: Actions minutes are free); the private supplier list is restored read-only from the suppliers workflow's cache, and the checks
# keep their own cache, so this job never overwrites the suppliers workflow's private files.
on:
  # timed by the company server (deploy/ops/schedule.tab), not by GitHub: see deploy/ops/SCHEDULE.md
  workflow_dispatch:
    inputs:
      limit:
        description: "companies to check this run"
        default: "4000"
      sample:
        description: "refine only a sample of N records (0 = all)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: company-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ${{ vars.RUNNER_LABEL || 'sinder' }}
    timeout-minutes: 75
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Private supplier list (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/private
          key: private-none
          restore-keys: private-
      - name: Previous checks
        uses: actions/cache@v4
        with:
          path: data/checks
          key: checks-${{ github.run_id }}
          restore-keys: checks-
      - run: pip install requests google-auth pycountry phonenumbers pypinyin dnspython
      - name: Server enrichment results (read-only; only on the company server's runners)
        # leads/enrich_server.py exports its merged records on the server; company_check merges them into the checks
        # (a newer server read replaces the hourly read) and refine.py fills the profile fields from them
        run: |
          mkdir -p data/checks
          if docker run --rm -v /opt/sinder/enrich/export:/x:ro alpine:3.20 test -s /x/enrich.jsonl.gz 2>/dev/null; then
            docker run --rm -v /opt/sinder/enrich/export:/x:ro alpine:3.20 cat /x/enrich.jsonl.gz > data/checks/enrich_server.jsonl.gz
            echo "server enrichment export: $(stat -c %s data/checks/enrich_server.jsonl.gz) bytes"
          else
            echo "no server enrichment export on this runner"
          fi
        continue-on-error: true
      - name: Priority list for the server's people lane (deals and the Check queue; names stay on the server)
        # leads/enrich_server.py reads /opt/sinder/enrich/priority.keys and looks these suppliers up in the registers first
        run: |
          python -m leads.company_check --priority-keys data/checks/priority.keys 2>&1 | tail -1
          if [ -s data/checks/priority.keys ] && docker run --rm -v /opt/sinder/enrich:/x:ro alpine:3.20 test -d /x 2>/dev/null; then
            docker run --rm -i -v /opt/sinder/enrich:/x alpine:3.20 sh -c 'umask 077; cat > /x/priority.keys.new && mv /x/priority.keys.new /x/priority.keys' < data/checks/priority.keys
            echo "priority keys placed on the server: $(wc -l < data/checks/priority.keys)"
          fi
          rm -f data/checks/priority.keys
        continue-on-error: true
      - name: Check companies
        run: python -m leads.company_check --limit ${{ inputs.limit || '4000' }} --minutes 25 2>&1 | tail -20
        continue-on-error: true
      - name: Official registers (GLEIF LEI, EU VIES)
        run: python -m leads.registry_check --minutes 10 2>&1 | tail -5
        continue-on-error: true
      - name: E-mail domain deliverability (DNS MX, parked, disposable; low priority, resumes where it stopped)
        run: python -m leads.mx_check --minutes 6 --workers 12 2>&1 | tail -2
        continue-on-error: true
      - name: Refine every supplier record (unchanged records are reused)
        run: python -m leads.refine --sample ${{ inputs.sample || '0' }} 2>&1 | grep -v "^ " | tail -5
      - name: Refine the other modules (tenders, buyers, projects, financing, logistics, importers)
        run: python -m leads.refine_modules --links 2500 --sites 150 --registers 3 2>&1 | grep -E "refine modules|Error|Traceback" | cut -c1-2000
        continue-on-error: true
      - name: Drop the server export copy (already merged into the checks)
        run: rm -f data/checks/enrich_server.jsonl.gz
      - name: Publish progress counts
        run: |
          git config user.name "commodity-feed-bot"; git config user.email "actions@users.noreply.github.com"
          cp data/leads/refine_progress.json /tmp/rp.json; mkdir -p /tmp/refined; cp data/leads/refined/*.csv /tmp/refined/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/rp.json data/leads/refine_progress.json
            mkdir -p data/leads/refined && cp /tmp/refined/*.csv data/leads/refined/ 2>/dev/null || true
            git add data/leads/refine_progress.json data/leads/refined
            git diff --cached --quiet && break
            git commit -q -m "refine progress: $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin HEAD:main && break
            sleep $((i * 10))
          done
