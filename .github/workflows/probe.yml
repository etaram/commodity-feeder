name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests curl_cffi aia certifi
      - run: python tools/probe.py
      - run: python tools/probe_extra.py || true
      - run: |
          git config user.name "commodity-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe: $(date -u +%H:%MZ)"
          git pull --rebase origin main
          git push
