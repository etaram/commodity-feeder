name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests && python -m leads.india_probe || true
      - name: probe endpoints
        run: |
          mkdir -p data/leads
          export SKIP=1
          UA="Mozilla/5.0 (compatible; SinderResearch/1.0)"
          : > data/leads/probe.txt
          while read -r name url; do
            code=$(curl -s -m 25 -L -o /tmp/o -w '%{http_code} %{size_download}' -A "$UA" "$url" || echo "ERR")
            echo "$name | $code | $(head -c 700 /tmp/o | tr '\n\r' '  ')" >> data/leads/probe.txt
          done <<'LIST'
          tw_openfun https://pcc-api.openfun.app/api/listbydate?date=20261029
          tw_pcc https://web.pcc.gov.tw/prkms/tender/common/noticeDate/readTenderNoticeDate
          hk_gld https://www.gld.gov.hk/en/tenders/
          hk_tenders https://www.gld.gov.hk/egazette/english/gazette/tender.html
          ph_geps https://notices.philgeps.gov.ph/GEPSNONPILOT/Tenders/SplashOpportunitiesSearchUI.aspx?menuIndex=3&ClickFrom=OpenOpp&Result=3
          kw_capt https://www.capt.gov.kw/
          kw_capt2 https://www.capt.gov.kw/en/tenders/
          bh_tb https://www.tenderboard.gov.bh/
          bh_tb2 https://etendering.tenderboard.gov.bh/Tenders/Active
          ar_comprar https://comprar.gob.ar/
          ar_open https://datos.gob.ar/dataset?q=contrataciones
          cr_sicop https://www.sicop.go.cr/index.jsp
          vn_mua https://muasamcong.mpi.gov.vn/en
          id_inaproc https://data.inaproc.id/
          my_myp https://www.eperolehan.gov.my/
          mn_tender https://www.tender.gov.mn/en
          kz_goszakup https://goszakup.gov.kz/en
          kg_zakupki https://zakupki.gov.kg/
          lk_pro https://www.nprocurement.gov.lk/
          bw_ppadb https://www.ppadb.co.bw/
          na_cpb https://www.cpb.com.na/
          zw_praz https://www.praz.org.zw/
          rs_jn https://jnportal.ujn.gov.rs/
          al_app https://www.app.gov.al/
          jo_joneps https://www.jordan-eprocurement.gov.jo/
          LIST
          mkdir -p data/leads/probe_html
          UA2="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -s -m 30 -L -A "$UA2" "https://eprocure.gov.in/eprocure/app?page=FrontEndLatestActiveTenders&service=page" -o data/leads/probe_html/cppp.html || true
          curl -s -m 30 -L -A "$UA2" "https://eprocure.gov.in/cppp/latestactivetendersnew/cpppdata" -o data/leads/probe_html/cppp_data.html || true
          curl -s -m 30 -L -A "$UA2" "https://www.gets.govt.nz/ExternalIndex.htm" -o data/leads/probe_html/gets.html || true
          curl -s -m 30 -L -A "$UA2" "https://etenders.gov.in/eprocure/app?page=FrontEndLatestActiveTenders&service=page" -o data/leads/probe_html/etenders.html || true
          curl -s -m 30 -L -A "$UA2" "https://mahatenders.gov.in/nicgep/app?page=FrontEndLatestActiveTenders&service=page" -o data/leads/probe_html/maha.html || true
          curl -s -m 30 -L -A "$UA2" "https://tenders.gov.in/" -o data/leads/probe_html/tenders_gov.html || true
          ls -la data/leads/probe_html
          cat data/leads/probe.txt
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/leads/probe.txt data/leads/probe_html; git commit -qm "probe results" || true
          git pull -q --rebase origin main; git push -q origin HEAD:main || true
