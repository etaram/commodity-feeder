name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe endpoints
        run: |
          mkdir -p data/leads
          UA="Mozilla/5.0 (compatible; SinderResearch/1.0)"
          : > data/leads/probe.txt
          while read -r name url; do
            code=$(curl -s -m 25 -L -o /tmp/o -w '%{http_code} %{size_download}' -A "$UA" "$url" || echo "ERR")
            echo "$name | $code | $(head -c 700 /tmp/o | tr '\n\r' '  ')" >> data/leads/probe.txt
          done <<'LIST'
          simap_a https://www.simap.ch/api/publications/v2/project/project-search?lang=en&processTypes=tender&pageSize=3
          simap_b https://www.simap.ch/api/publications/v2/project/project-search?lang=en&pubTypes=tender&pageSize=3
          simap_c https://www.simap.ch/api/publications/v2/project/project-search?pageSize=3&lang=de&search=
          simap_d https://www.simap.ch/api/publications/v1/publication/search
          gets_list https://www.gets.govt.nz/ExternalIndex.htm
          cppp https://eprocure.gov.in/eprocure/app?page=FrontEndLatestActiveTenders&service=page
          cg_a https://dadosabertos.compras.gov.br/modulo-contratacoes/1_consultarContratacoes_PNCP_14133?pagina=1&tamanhoPagina=10&dataPublicacaoPncpInicial=2026-10-20&dataPublicacaoPncpFinal=2026-10-30&codigoModalidade=8
          cg_b https://dadosabertos.compras.gov.br/modulo-contratacoes/2_consultarItensContratacoes_PNCP_14133?pagina=1&tamanhoPagina=10&dataInclusaoPncpInicial=2026-10-25&dataInclusaoPncpFinal=2026-10-30
          comprasmx https://comprasmx.buengobierno.gob.mx/sitiopublico/
          nz_gets_atom https://www.gets.govt.nz/Rss.htm
          sg_gebiz https://www.gebiz.gov.sg/
          ph_philgeps https://notices.philgeps.gov.ph/
          bd_cptu https://eprocure.gov.bd/
          ke_open https://tenders.go.ke/api/tenders?per_page=2
          rs_javne https://jnportal.ujn.gov.rs/
          mk_esjn https://e-nabavki.gov.mk/
          ge_spa https://tenders.procurement.gov.ge/
          LIST
          cat data/leads/probe.txt
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/leads/probe.txt; git commit -qm "probe results" || true
          git pull -q --rebase origin main; git push -q origin HEAD:main || true
