name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe endpoints
        run: |
          mkdir -p data/leads
          UA="Mozilla/5.0 (compatible; SinderResearch/1.0)"
          : > data/leads/probe.txt
          while read -r name url; do
            code=$(curl -s -m 25 -L -o /tmp/o -w '%{http_code} %{size_download}' -A "$UA" "$url" || echo "ERR")
            echo "$name | $code | $(head -c 90 /tmp/o | tr '\n\r' '  ')" >> data/leads/probe.txt
          done <<'LIST'
          simap https://www.simap.ch/api/publications/v2/project/project-search?processTypes=tender&orderAddressCantons=&lang=en&pageSize=3
          simap2 https://www.simap.ch/api/publications/v2/project/project-search?pageSize=3
          gets_rss https://www.gets.govt.nz/rss/rss.xml
          gets_ext https://www.gets.govt.nz/ExternalIndex.htm
          edgar_tickers https://www.sec.gov/files/company_tickers.json
          edgar_search https://efts.sec.gov/LatestSearch/rest/search-index?q=%22Boeing%22&forms=10-K
          chile https://api.mercadopublico.cl/servicios/v1/publico/licitaciones.json?estado=activas&ticket=F8537A18-6766-4DEF-9E59-426B4FEE2844
          comprasgov_lic https://dadosabertos.compras.gov.br/modulo-legado/1_consultarLicitacao?pagina=1&tamanhoPagina=10&data_publicacao_inicial=2026-10-01&data_publicacao_final=2026-10-30
          korea https://www.g2b.go.kr/
          india https://eprocure.gov.in/eprocure/app?page=FrontEndLatestActiveTenders&service=page
          doffin https://betaapi.doffin.no/public/v2/search?searchString=steel&numHitsPerPage=2
          boamp https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp/records?limit=2
          ted_v3 https://api.ted.europa.eu/v3/notices/search
          uk_sanc https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.csv
          uk_sanc2 https://assets.publishing.service.gov.uk/media/UK-Sanctions-List.xml
          canada_sanc https://www.international.gc.ca/world-monde/assets/office_docs/international_relations-relations_internationales/sanctions/sema-lmes.xml
          swiss_sanc https://www.sesam.search.admin.ch/sesam-search-web/pages/search.xhtml
          LIST
          cat data/leads/probe.txt
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/leads/probe.txt; git commit -qm "probe results" || true
          git pull -q --rebase origin main; git push -q origin HEAD:main || true
