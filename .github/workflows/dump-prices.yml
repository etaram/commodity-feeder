name: dump-prices
# Manual: save sample pages of candidate price sources as an artifact (tools/dump_urls.txt), for writing parsers.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/dump_pages.py tools/dump_urls.txt pages
      - name: Push the pages to a scratch branch (deleted after use)
        run: |
          git config user.name "price-dump"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan scratch-pages; git rm -rq --cached . ; git add -f pages; git commit -qm "sample pages"; git push -qf origin scratch-pages
