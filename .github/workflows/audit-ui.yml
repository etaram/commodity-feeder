name: audit-ui
on:
  workflow_dispatch:
    inputs:
      lang: { description: 'he or en', required: false, default: 'he' }
      views: { description: 'comma list of views (empty = all)', required: false, default: '' }
permissions:
  contents: write
concurrency: { group: audit-ui, cancel-in-progress: false }
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "mcr.microsoft.com/playwright:v1.56.1-noble" }
    steps:
      - uses: actions/checkout@v4
      - name: walk the panel on a phone
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p /tmp/pw && cp tools/audit/*.mjs /tmp/pw/ && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.56.1 google-auth-library >/dev/null
          T=$(node token.mjs); echo "::add-mask::$T"
          AUDIT_TOKEN="$T" LANG_UI="${{ inputs.lang }}" VIEWS="${{ inputs.views }}" node ui_audit.mjs || true
          ls audit | head -50
      - name: publish the report to the scratch-audit branch
        run: |
          (command -v git >/dev/null) || (apt-get update -qq && apt-get install -y -qq git >/dev/null)
          cd /tmp/pw/audit && git init -q && git checkout -q -b scratch-audit && git add -A
          git -c user.name=audit -c user.email=audit@sinder.pro commit -qm "ui audit ${{ inputs.lang }} $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scratch-audit
