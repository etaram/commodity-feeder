name: server-ops
# Runs one named maintenance script from deploy/ops on the company server. Only scripts that exist in the repository
# can run: the input is a choice, never free text.
on:
  workflow_dispatch:
    inputs:
      task:
        description: script in deploy/ops to run
        type: choice
        options: [status, harden-ssh, stack-up, backup, bench-llm, install-rclone, data-gateway, gateway-stats, mail-dns, audit-sample, eval-split, bench-semantic, embed-universe, semantic-status]
        default: status
permissions:
  contents: read
jobs:
  run:
    runs-on: [self-hosted, sinder]
    # the semantic bench downloads and runs several models one after another; every other task keeps 30 minutes
    timeout-minutes: ${{ inputs.task == 'bench-semantic' && 55 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - run: bash "deploy/ops/${{ inputs.task }}.sh"
        env:
          # only the semantic jobs read the supplier index: the index key (repository secret, else the Config tab read
          # with the service account, as supplier-eval does); every other task gets empty values
          WEB_INDEX_KEY: ${{ (inputs.task == 'bench-semantic' || inputs.task == 'embed-universe') && secrets.WEB_INDEX_KEY || '' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ (inputs.task == 'bench-semantic' || inputs.task == 'embed-universe') && secrets.GOOGLE_SERVICE_ACCOUNT_JSON || '' }}
