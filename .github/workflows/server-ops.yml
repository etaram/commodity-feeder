name: server-ops
# Runs one named maintenance script from deploy/ops on the company server. Only scripts that exist in the repository
# can run: the input is a choice, never free text.
on:
  workflow_dispatch:
    inputs:
      task:
        description: script in deploy/ops to run
        type: choice
        options: [status, runners-restart, enrich-probe, enrich-sample, enrich-start, enrich-status, enrich-stop, enrich-review, enrich-people, harden-ssh, stack-up, backup, bench-llm, install-rclone, data-gateway, gateway-stats, mail-dns, audit-sample, eval-split, serverpanel-install, scheduler-install, schedule-status, runner-priority, add-runners, browser-deps]
        default: status
permissions:
  contents: read
  actions: read      # schedule-status reads the last successful run of each workflow
jobs:
  run:
    runs-on: [self-hosted, sinder]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash "deploy/ops/${{ inputs.task }}.sh"
        env:
          GH_TOKEN: ${{ github.token }}
          # only the scheduler install task receives the dispatch token (it writes it to a root-only file on the server)
          # only the add-runners task receives the one-hour runner registration token
          RUNNER_REG_TOKEN: ${{ inputs.task == 'add-runners' && secrets.RUNNER_REG_TOKEN || '' }}
          SCHED_DISPATCH_TOKEN: ${{ inputs.task == 'scheduler-install' && secrets.SCHED_DISPATCH_TOKEN || '' }}
          # only the enrichment start and the people sample receive the Companies House key (written root-only on the server)
          COMPANIES_HOUSE_API_KEY: ${{ (inputs.task == 'enrich-start' || inputs.task == 'enrich-people') && secrets.COMPANIES_HOUSE_API_KEY || '' }}
