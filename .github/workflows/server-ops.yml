name: server-ops
# Runs one named maintenance script from deploy/ops on the company server. Only scripts that exist in the repository
# can run: the input is a choice, never free text.
on:
  workflow_dispatch:
    inputs:
      task:
        description: script in deploy/ops to run
        type: choice
        options: [status, harden-ssh, stack-up, backup, bench-llm, install-rclone, data-gateway, gateway-stats, mail-dns, audit-sample, eval-split, env-check, server-up, server-env]
        default: status
permissions:
  contents: read
jobs:
  run:
    runs-on: [self-hosted, sinder]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash "deploy/ops/${{ inputs.task }}.sh"
        # only the server-env task receives the SERVER_* secrets (the owner's one step to fill the server .env)
        env:
          SERVER_AUTH_SECRET: ${{ inputs.task == 'server-env' && secrets.SERVER_AUTH_SECRET || '' }}
          SERVER_TEAM_USER: ${{ inputs.task == 'server-env' && secrets.SERVER_TEAM_USER || '' }}
          SERVER_TEAM_PASSCODE: ${{ inputs.task == 'server-env' && secrets.SERVER_TEAM_PASSCODE || '' }}
          SERVER_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ inputs.task == 'server-env' && (secrets.SERVER_GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON) || '' }}
          SERVER_WEB_INDEX_KEY: ${{ inputs.task == 'server-env' && secrets.SERVER_WEB_INDEX_KEY || '' }}
          SERVER_ANTHROPIC_API_KEY: ${{ inputs.task == 'server-env' && (secrets.SERVER_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY) || '' }}
          SERVER_ANTHROPIC_WORKSPACE_ID: ${{ inputs.task == 'server-env' && secrets.SERVER_ANTHROPIC_WORKSPACE_ID || '' }}
