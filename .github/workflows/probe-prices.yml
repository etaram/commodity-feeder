name: probe-prices
# Manual: which candidate physical-price sources answer from a GitHub runner (tools/probe_urls.txt).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe_links.py tools/probe_urls.txt "Thai|Indicator|Pink Sheet|Arabica"
